name: Runtime or product bug
description: Report one reproducible regression or acceptance failure.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: platform
    attributes:
      label: Affected platform
      options:
        - Windows
        - Ubuntu / Linux
        - Both
        - CI only
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Explain the user-visible failure and its business impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start with...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include sanitized logs, screenshots, health output, or failing test names. Never include secrets or customer data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: Full commit SHA and relevant PawApp/plugin version
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Data and rollback impact
      description: State whether Workspace or database data is at risk and how to return to the last known-good state.
    validations:
      required: true
