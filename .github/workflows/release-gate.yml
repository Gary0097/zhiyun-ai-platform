name: AI-OS release gate

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify clean QwenPaw release tree and locked PawApps
        run: node scripts/verify-release.mjs
