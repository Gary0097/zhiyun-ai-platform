<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智造云 · 企业 AI 智能体平台</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--line:#e5e9f2;--txt:#1c2333;--sub:#6b7280;--pri:#2b5fd9;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;margin:0}
body{font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt)}
#login{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:18px}
#login .card{background:var(--card);padding:34px 40px;border-radius:12px;box-shadow:0 8px 30px rgba(28,35,51,.08);width:360px}
#login h1{font-size:19px;margin-bottom:4px;display:flex;align-items:center;gap:10px}
#login h1 img{height:34px;width:auto}
#login p{color:var(--sub);font-size:12px;margin-bottom:18px}
input,select,textarea,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
button{background:var(--pri);color:#fff;border:none;cursor:pointer;width:auto;padding:8px 16px}
button.ghost{background:#fff;color:var(--txt);border:1px solid var(--line)}
button.danger{background:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
label{font-size:12px;color:var(--sub);display:block;margin:10px 0 4px}
#app{display:none}
aside{position:fixed;left:0;top:0;bottom:0;width:225px;background:#101828;color:#cbd2e0;overflow-y:auto;padding:14px 0}
aside::-webkit-scrollbar{width:4px}
aside::-webkit-scrollbar-thumb{background:#2a3654;border-radius:2px}
aside .brand{color:#fff;font-weight:700;padding:8px 18px 14px;border-bottom:1px solid #1f2a44;font-size:15px;display:flex;align-items:center;gap:9px}
aside .brand img{height:30px;width:auto;border-radius:5px;background:#fff}
aside .menu-grp{padding:14px 18px 4px;font-size:11px;color:#5d6b8a;letter-spacing:.06em}
aside a{display:flex;align-items:center;gap:9px;padding:8px 16px;color:#cbd2e0;text-decoration:none;font-size:13px;cursor:pointer;border-left:2px solid transparent}
aside a:hover{background:#18213a;color:#fff}
aside a svg{width:15px;height:15px;flex:none;opacity:.85}
aside a.on{background:var(--pri);color:#fff;border-radius:6px;margin:2px 10px;padding:8px 10px;border-left-color:transparent}
main{margin-left:225px;padding:22px 26px;height:100vh;overflow:auto}
h2{font-size:17px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.metrics{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.metric{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.metric .v{font-size:22px;font-weight:700}.metric .k{color:var(--sub);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f8fafc;color:var(--sub);font-weight:600;white-space:nowrap}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.tag.ok{background:#e7f6ec;color:var(--ok)}.tag.warn{background:#fdf1e2;color:var(--warn)}.tag.bad{background:#fdeaea;color:var(--bad)}.tag.info{background:#e8effd;color:var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.row>div{flex:1;min-width:140px}
.bar{display:flex;align-items:flex-end;gap:6px;height:180px;padding:8px 4px}
.bar .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar .stick{width:70%;background:linear-gradient(180deg,#4d7cf0,#2b5fd9);border-radius:4px 4px 0 0}
pre{background:#0f172a;color:#c8d3f5;padding:12px;border-radius:8px;font-size:12px;overflow:auto;max-height:420px}
.hint{color:var(--sub);font-size:12px}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto}
.detail{font-size:12px;color:var(--sub)}
/* 聊天（AI 对话现由 dsh iframe 提供，原自研对话样式随前端一起移除） */
.empty{color:var(--sub);text-align:center;padding:40px 0}
/* iframe 工作台 */
.framewrap{background:var(--card);border:1px solid var(--line);border-radius:10px;height:calc(100vh - 90px);overflow:hidden;display:flex;flex-direction:column}
.framewrap .head{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.framewrap iframe{flex:1;border:none;width:100%}
/* 设置页签 */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs .tab{padding:7px 16px;border-radius:8px;background:#fff;border:1px solid var(--line);cursor:pointer;font-size:13px}
.tabs .tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.logobox{display:flex;align-items:center;gap:14px;margin:8px 0}
.logobox img{height:56px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px}
/* 设置中心（左侧二级导航） */
.settings-wrap{display:grid;grid-template-columns:172px 1fr;gap:18px;align-items:start}
.snav{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 0;position:sticky;top:0}
.snav-grp{padding:10px 16px 4px;font-size:11px;color:var(--sub);letter-spacing:.06em}
.snav-item{display:block;padding:7px 16px;color:var(--txt);text-decoration:none;font-size:13px;cursor:pointer;border-left:2px solid transparent}
.snav-item:hover{background:#f4f7ff}
.snav-item.on{color:var(--pri);font-weight:600;border-left-color:var(--pri);background:#eef3ff}
/* 运行状态徽标 */
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.pulse.run{background:var(--ok);animation:pulse 1.2s infinite}
.pulse.idle{background:#9ca3af}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 6px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
/* 消息流 */
.msgflow{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msgflow .m{padding:8px 12px;border-radius:8px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.msgflow .m .who{font-size:11px;color:var(--sub);margin-bottom:2px}
.msgflow .m.user{background:#e8effd}
.msgflow .m.assistant{background:#f6f8fc;border:1px solid var(--line)}
/* AI 报告（markdown 渲染容器） */
.md-report{max-height:640px;overflow:auto;padding-right:6px}
.md-report table{margin:8px 0}
.md-report::-webkit-scrollbar{width:5px}
.md-report::-webkit-scrollbar-thumb{background:#c9d2e5;border-radius:3px}
/* 功能模块入口（AI 对话首页） */
.feat-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:14px;background:#eef2fa;border:1px solid var(--line);font-size:12.5px;cursor:pointer;user-select:none}
.feat-chip:hover{background:#e2e9fb}
.feat-chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.feat-chip i{font-style:normal;font-size:10px;background:rgba(43,95,217,.12);color:var(--pri);border-radius:8px;padding:0 6px}
.feat-chip.on i{background:rgba(255,255,255,.25);color:#fff}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px;margin-top:10px}
.feat-item{border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:#fff}
.feat-item:hover{border-color:var(--pri);background:#f5f8ff}
.feat-item b{display:block;font-size:12.5px}
.feat-item span{font-size:11px;color:var(--sub)}
.feat-reply{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;max-height:280px;overflow:auto}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h1 id="lg-title"><img id="lg-logo" style="display:none">智造云 · 企业 AI 智能体平台</h1>
    <p>多租户业务执行平台</p>
    <label>用户名</label><input id="lg-user" value="admin.a">
    <label>密码</label><input id="lg-pass" type="password" autocomplete="current-password" placeholder="请输入密码">
    <div style="margin-top:16px"><button onclick="login()" style="width:100%">登 录</button></div>
    <p style="margin-top:12px">admin.a 企业A管理员 · platform 平台管理员 · sales.a 普通员工 · audit.a 审计员</p>
  </div>
</div>
<div id="app">
  <aside id="menu"></aside>
  <main id="view"></main>
</div>
<script>
const $ = (s)=>document.querySelector(s)
let TOKEN='', ME=null, BRAND={name:'',logo:''}
const api = async (method, path, body)=>{
  const res = await fetch(path,{method,headers:{'content-type':'application/json','authorization':'Bearer '+TOKEN},body:body?JSON.stringify(body):undefined})
  const data = await res.json().catch(()=>({}))
  if(!res.ok) throw Object.assign(new Error(data.error||res.statusText),{status:res.status,data})
  return data
}
// 中性线性图标（Feather 风格，stroke 渲染，无 emoji）
const ICONS={
  chat:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  data:'<path d="M3 3v18h18"/><path d="M7 14l4-5 3 3 5-7"/>',
  monitor:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
  bot:'<rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/>',
  logs:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
}
const MENU=[
  {grp:'工作台'},
  {t:'AI 对话',p:'chat',i:'chat',f:'ai_center'},
  {t:'企业数据中心',p:'datacenter2',i:'data',f:'data_center'},
  {t:'AI 运行监控',p:'autorun',i:'monitor',f:'data_center',perm:'stats:view'},
  {t:'AI-OS 监视器',p:'os-monitor',i:'monitor',f:'data_center',perm:'stats:view'},
  {grp:'任务'},
  {t:'新建任务',p:'worktask',i:'plus',perm:'worktask:run'},
  {t:'项目',p:'projects',i:'folder',perm:'worktask:run'},
  {t:'定时任务',p:'tasks',i:'clock',perm:'task:manage',f:'automation_center'},
  {t:'知识库',p:'knowledge',i:'book',perm:'agent:manage',f:'ai_center'},
  {grp:'管理'},
  {t:'数据库浏览',p:'dbview',i:'db',perm:'system:manage'},
  {t:'AI 中心',p:'ai-center',i:'bot',f:'ai_center',perm:'agent:manage'},
  {t:'日志中心',p:'log-center',i:'logs',f:'log_center',perm:'log:view'},
  {grp:'系统'},
  {t:'系统设置',p:'settings',i:'gear',hub:true},
]
// 设置中心页签注册表：[key, 标题, 所需权限, 所需功能授权, 子页签[[标题,页面id]]]
// 数据库浏览/AI 中心/日志中心/定时任务已移回侧边栏独立页面，设置中心仅保留配置与运营项
const SETTINGS_TABS=[
  ['brand','品牌与入口','system:manage',null],
  ['model','模型配置','system:manage',null],
  ['autorun','AI 自动运行','simulator:run',null],
  ['sim','数据模拟中心','simulator:run','simulator_center'],
  ['trace','数据修改留痕','log:view',null],
  ['company','企业管理','system:manage','system_admin',[['企业','tenants'],['用户','users'],['部门','depts'],['功能授权','features']]],
  ['datacenter','数据管理中心','data:manage','system_admin'],
  ['harness','系统监控','stats:view','data_center'],
]
// 设置页签分组（左侧二级导航的分区标题）
const SETTINGS_GROUPS=[['配置',['brand','model','autorun','sim']],['运营',['trace','company','datacenter','harness']]]
// 旧 hash 重定向表：值 = 完整新 hash（侧边栏独立页面或设置中心页签），保持旧链接与页内跳转兼容
const FOLDED_PAGE={
  agents:'ai-center?sub=agents', skills:'ai-center?sub=skills', tools:'ai-center?sub=tools',
  tasks:'tasks', jobs:'tasks?sub=jobs', 'jobs-failed':'tasks?sub=jobs-failed',
  'log-op':'log-center?sub=log-op','log-ai':'log-center?sub=log-ai','log-tool':'log-center?sub=log-tool',
  'log-job':'log-center?sub=log-job','log-audit':'log-center?sub=log-audit','log-amend':'log-center?sub=log-amend',
  tenants:'settings?tab=company&sub=tenants', users:'settings?tab=company&sub=users',
  depts:'settings?tab=company&sub=depts', features:'settings?tab=company&sub=features',
  datacenter:'settings?tab=datacenter', harness:'settings?tab=harness',
  simulator:'settings?tab=sim', 'log-change':'settings?tab=trace', model:'settings?tab=model',
}
const hasPerm=p=>ME.perms.includes('*')||ME.perms.includes(p)
const tabVisible=t=>hasPerm(t[2])&&(!t[3]||ME.features.includes(t[3]))

async function login(){
  try{
    const r=await api('POST','/api/auth/login',{username:$('#lg-user').value,password:$('#lg-pass').value})
    TOKEN=r.token; ME=await api('GET','/api/auth/me')
    BRAND=await api('GET','/api/settings/brand')
    applyBrand()
    $('#login').style.display='none';$('#app').style.display='block'
    renderMenu(); go(location.hash.slice(1)||'chat')
  }catch(e){alert('登录失败：'+e.message)}
}
function applyBrand(){
  if(BRAND.name){
    document.title=BRAND.name
    const t=$('#lg-title'); t.childNodes[t.childNodes.length-1].textContent=BRAND.name
  }
  const logo=$('#lg-logo')
  if(BRAND.logo){logo.src=BRAND.logo;logo.style.display='inline'}
  else logo.style.display='none'
}
function renderMenu(){
  let h=`<div class="brand">${BRAND.logo?`<img src="${BRAND.logo}">`:''}<span>${BRAND.name||'智造云'}</span></div>`
  const svg=i=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[i]}</svg>`
  const settingsVisible=SETTINGS_TABS.some(tabVisible)
  for(const item of MENU){
    if(item.grp){h+=`<div class="menu-grp">${item.grp}</div>`;continue}
    if(item.f&&!ME.features.includes(item.f))continue
    if(item.perm&&!hasPerm(item.perm))continue
    if(item.hub&&!settingsVisible)continue
    h+=`<a id="nav-${item.p}" onclick="go('${item.p}')">${svg(item.i)}<span>${item.t}</span></a>`
  }
  $('#menu').innerHTML=h
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const tag=s=>`<span class="tag ${s==='success'||s==='published'||s==='active'||s==='绿色'||s==='done'?'ok':s==='failed'||s==='红色'||s==='disabled'?'bad':'warn'}">${esc(s)}</span>`
const tbl=(cols,rows)=>`<table><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</table>`

const PAGES={
  // AI 对话：功能模块入口条 + 直接内嵌 dsh Web（Harness 会话体系），每个工作区即对话中心
  async chat(){
    let url='http://127.0.0.1:8308'
    try{ url=(await api('GET','/api/settings/dsh')).url||url }catch{}
    return `<h2>AI 对话</h2>
    <div class="card" style="padding:10px 14px;margin-bottom:12px" id="feat-entry"><span class="hint">功能模块加载中…</span></div>
    <div class="framewrap" style="height:calc(100vh - 215px)"><div class="head">
      <span class="hint">由 Agent 工作台提供完整对话能力（会话/文件/终端/技能），工作区即对话中心。地址可在系统设置中修改。</span>
      <span><button class="ghost" onclick="window.open('${esc(url)}','_blank')">新窗口打开</button></span>
    </div>
    <iframe src="${esc(url)}"></iframe></div>`
  },
  // AI 运行监控：看板（聚合统计）+ 状态/角色进度/金汉隆报告/最近执行/实时消息流（5s 轮询）
  async autorun(){
    return `<h2>AI 运行监控</h2>
    <div id="ar-status"><div class="card"><span class="hint">加载中…</span></div></div>
    <div class="card"><b>Agent 角色进度</b><div id="ar-roles" style="margin-top:10px"><span class="hint">加载中…</span></div></div>
    <div class="card" id="ar-analytics"><span class="hint">加载中…</span></div>
    <div class="card" id="ar-report-card"><span class="hint">加载中…</span></div>
    <div class="card"><b>最近执行（data_origin=auto-simulated）</b><div id="ar-execs" style="margin-top:10px"><span class="hint">加载中…</span></div></div>
    <div class="card"><b>实时消息流</b><div class="msgflow" id="ar-msgs" style="margin-top:10px"></div></div>`
  },
  async 'os-monitor'(){
    const s=await api('GET','/api/os/monitor?limit=50')
    const metrics=[['任务总数',s.kpi.tasks],['活跃进程',s.kpi.activeProcesses],['调度队列',s.kpi.queuedJobs],['24h 失败',s.kpi.failed24h],['24h Checkpoint',s.kpi.checkpoints24h],['24h 风险拦截',s.kpi.riskBlocked24h]]
    const summary=(rows,key='status')=>rows.length?rows.map(r=>`<span class="tag ${r[key]==='failed'||r[key]==='risk.blocked'?'bad':r[key]==='succeeded'||r[key]==='running'?'ok':'info'}" style="margin:0 6px 6px 0">${esc(r[key])} · ${r.count}</span>`).join(''):'<span class="hint">暂无数据</span>'
    return `<h2>AI-OS 系统监视器</h2>
      <div class="grid metrics">${metrics.map(x=>`<div class="metric"><div class="v">${x[1]??0}</div><div class="k">${x[0]}</div></div>`).join('')}</div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:16px">
        <div class="card"><b>任务状态</b><div style="margin-top:12px">${summary(s.tasksByStatus)}</div></div>
        <div class="card"><b>进程状态</b><div style="margin-top:12px">${summary(s.processesByStatus)}</div></div>
        <div class="card"><b>执行器状态</b><div style="margin-top:12px">${s.executionsByRunner.length?s.executionsByRunner.map(r=>`<span class="tag info" style="margin:0 6px 6px 0">${esc(r.runner)} / ${esc(r.status)} · ${r.count}</span>`).join(''):'<span class="hint">暂无数据</span>'}</div></div>
      </div>

async function loadDbTable(table,page=1,q=''){
  const el=$('#db-table'); if(!el)return
  el.innerHTML='<span class="hint">加载中…</span>'
  try{
    const info=await api('GET',`/api/db/table/${table}?page=${page}&size=50&q=${encodeURIComponent(q)}`)
    const pages=Math.max(1,Math.ceil(info.total/info.size))
    const cell=v=>{
      if(v===null||v===undefined)return '<span class="hint">NULL</span>'
      const s=String(v)
      if(s.length>60)return `<span title="${esc(s)}">${esc(s.slice(0,60))}…</span>`
      return esc(s)
    }
    el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
      <div><b style="font-size:15px">${esc(info.label)}</b> <span class="hint">${info.name} · ${info.total.toLocaleString()} 行</span></div>
      <div style="display:flex;gap:8px">
        <input id="db-q" placeholder="全列搜索…" value="${esc(q)}" style="width:200px" onkeydown="if(event.key==='Enter')dbNav('${table}',1,$('#db-q').value)">
        <button class="ghost" onclick="dbNav('${table}',1,$('#db-q').value)">搜索</button>
        <button class="ghost" onclick="location.hash='dbview';go('dbview')">← 表清单</button>
      </div>
    </div>
    <div style="overflow:auto;max-height:calc(100vh - 260px)">
    <table><tr><th>#</th>${info.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>
    ${info.rows.map(r=>`<tr><td class="hint">${esc(String(r.rowid??''))}</td>${info.columns.map(c=>`<td>${cell(r[c])}</td>`).join('')}</tr>`).join('')}</table></div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
      <button class="ghost" ${page<=1?'disabled':''} onclick="dbNav('${table}',${page-1},'${esc(q)}')">上一页</button>
      <span class="hint">第 ${page} / ${pages} 页</span>
      <button class="ghost" ${page>=pages?'disabled':''} onclick="dbNav('${table}',${page+1},'${esc(q)}')">下一页</button>
    </div>`
  }catch(e){el.innerHTML=`<div class="card">加载失败：${esc(e.message)}</div>`}
}
function dbNav(table,page,q){
  location.hash=`dbview?dbtable=${table}&dbpage=${page}&dbq=${encodeURIComponent(q||'')}`
  loadDbTable(table,page,q||'')
}

async function go(page,extra){
  // 清理上一页的轮询定时器（如 AI 运行监控页的 5s 刷新）
  if(window.__pageTimer){clearInterval(window.__pageTimer);window.__pageTimer=null}

  let base=page.split('?')[0]
  // 旧 hash 重定向：FOLDED_PAGE 值为完整新 hash（侧边栏独立页面或设置中心页签）
  const folded=FOLDED_PAGE[base]
  if(folded){
    page=folded+(extra!==undefined&&extra!==null&&extra!==''?'&q='+encodeURIComponent(extra):'')
    base=page.split('?')[0]
  }
  if(!location.hash.slice(1).startsWith(base)) location.hash=page

    if($('#ai-insight')) loadInsight()

/* ---- AI 洞察（数据看板）---- */
// Markdown 渲染器（表格/列表/标题/加粗/代码块/引用/分隔线），用于 AI 报告与洞察卡片
const md=s=>{
  const src=String(s??'')
  const lines=src.split('\n')
  let html=''; let listBuf=[]; let tableBuf=[]; let codeBuf=null
  const inline=t=>esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code style="background:#f0f3f8;padding:1px 5px;border-radius:3px;font-size:12px">$1</code>')
    .replace(/\*(.+?)\*/g,'<i>$1</i>')
  const flushList=()=>{ if(listBuf.length){html+=`<ul style="margin:6px 0 6px 20px">${listBuf.map(x=>`<li style="margin:3px 0">${inline(x)}</li>`).join('')}</ul>`;listBuf=[]} }
  const flushTable=()=>{
    if(!tableBuf.length)return
    const rows=tableBuf.filter(r=>!/^\s*\|?[\s:|-]+\|?\s*$/.test(r)) // 去掉分隔行
    if(!rows.length){tableBuf=[];return}
    const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim())
    const head=cells(rows[0])
    html+=`<div style="overflow:auto;margin:10px 0"><table style="font-size:12.5px"><tr>${head.map(h=>`<th style="white-space:nowrap">${inline(h)}</th>`).join('')}</tr>${rows.slice(1).map(r=>{const c=cells(r);return `<tr>${head.map((_,i)=>`<td>${inline(c[i]??'')}</td>`).join('')}</tr>`}).join('')}</table></div>`
    tableBuf=[]
  }
  for(const raw of lines){
    const line=raw.replace(/\s+$/,'')
    if(line.trim().startsWith('```')){ // 代码块开关
      if(codeBuf===null){flushList();flushTable();codeBuf=[]}
      else{html+=`<pre style="font-size:12px">${esc(codeBuf.join('\n'))}</pre>`;codeBuf=null}
      continue
    }
    if(codeBuf!==null){codeBuf.push(raw);continue}
    if(/^\s*\|.*\|\s*$/.test(line)){flushList();tableBuf.push(line);continue}
    flushTable()
    const h=line.match(/^(#{1,4})\s+(.*)$/)
    if(h){flushList();const size=[18,16,14.5,13.5][h[1].length-1];html+=`<div style="font-size:${size}px;font-weight:700;margin:${h[1].length<=2?'14px':'10px'} 0 6px;color:${h[1].length<=2?'var(--txt)':'#33406b'}">${inline(h[2])}</div>`;continue}
    if(/^\s*[-*]\s+/.test(line)){listBuf.push(line.replace(/^\s*[-*]\s+/,''));continue}
    if(/^\s*\d+[.、]\s+/.test(line)){listBuf.push(line.replace(/^\s*\d+[.、]\s+/,''));continue}
    flushList()
    if(/^\s*(---|===)\s*$/.test(line)){html+='<hr style="border:none;border-top:1px solid var(--line);margin:12px 0">';continue}
    if(/^\s*>\s?/.test(line)){html+=`<blockquote style="border-left:3px solid var(--pri);margin:8px 0;padding:4px 12px;color:#47536e;background:#f6f8fd">${inline(line.replace(/^\s*>\s?/,''))}</blockquote>`;continue}
    if(line.trim()==='')continue
    html+=`<p style="margin:6px 0">${inline(line)}</p>`
  }
  flushList();flushTable()
  if(codeBuf!==null)html+=`<pre style="font-size:12px">${esc(codeBuf.join('\n'))}</pre>`
  return html
}

  const r=await api('POST','/api/business/clear',{})
  alert('已清除 '+r.removed+' 条生成业务数据');go('settings')
}
/* ---- 新建任务（一次性 AI 任务）---- */
const WT_STATUS={pending:'待执行',running:'执行中',success:'成功',failed:'失败'}
function startWorkTaskTimer(){
  refreshWorktasks()
  window.__pageTimer=setInterval(refreshWorktasks,5000)
}
async function refreshWorktasks(){
  const el=$('#wt-list'); if(!el)return
  try{
    const qs=new URLSearchParams(location.hash.split('?')[1]||'')
    const pid=qs.get('project_id')||''
    const rows=await api('GET','/api/worktasks'+(pid?'?project_id='+pid:''))
    el.innerHTML=rows.length?tbl([
      ['ID',r=>r.id],['任务',r=>`<b>${esc(r.title)}</b>`],['Agent',r=>esc(r.agent_name||r.agent_id)],['项目',r=>esc(r.project_name||'-')],
      ['状态',r=>`<span class="tag ${r.status==='success'?'ok':r.status==='failed'?'bad':'warn'}">${WT_STATUS[r.status]||r.status}</span>`],
      ['耗时',r=>r.latency_ms?Math.round(r.latency_ms/1000)+'s':'-'],
      ['结果',r=>r.output?`<span class="detail" title="${esc(r.output)}">${esc(r.output.slice(0,80))}…</span>`:r.error?`<span style="color:var(--bad)">${esc(r.error.slice(0,60))}</span>`:'-'],
      ['trace',r=>r.trace_id?`<a style="color:var(--pri);cursor:pointer" onclick="traceView('${r.trace_id}')">${r.trace_id.slice(0,8)}…</a>`:'-'],
      ['操作',r=>r.status==='running'?'<span class="hint">执行中…</span>':`<button class="ghost" onclick="api('POST','/api/worktasks/${r.id}/run').then(refreshWorktasks)">重跑</button> <button class="danger" onclick="worktaskDelete(${r.id})">删除</button>`],
    ],rows):'<span class="hint">暂无任务，使用上方表单创建第一个 AI 任务。</span>'
    // 全部终态时停止轮询（有 pending/running 继续刷新）
    if(!rows.some(r=>r.status==='pending'||r.status==='running')){
      if(window.__pageTimer){clearInterval(window.__pageTimer);window.__pageTimer=null}
    }
  }catch(e){ /* 轮询失败下轮重试 */ }
}
async function worktaskCreate(){
  const title=$('#wt-title')?.value.trim(); const instruction=$('#wt-instruction')?.value.trim()
  if(!title||!instruction){alert('请填写任务标题与指令');return}
  try{
    await api('POST','/api/worktasks',{title,instruction,agent_id:Number($('#wt-agent').value),project_id:$('#wt-project').value?Number($('#wt-project').value):null})
    $('#wt-title').value=''; $('#wt-instruction').value=''
    if(!window.__pageTimer) startWorkTaskTimer(); else refreshWorktasks()
  }catch(e){alert('创建失败：'+e.message)}
}
async function worktaskDelete(id){
  if(!confirm('确认删除该任务？'))return
  try{await api('DELETE','/api/worktasks/'+id);refreshWorktasks()}catch(e){alert(e.message)}
}
/* ---- 项目 ---- */
async function projectCreate(){
  const name=$('#pj-name')?.value.trim()
  if(!name){alert('请填写项目名称');return}
  try{await api('POST','/api/projects',{name,description:$('#pj-desc')?.value.trim()||null});go('projects')}catch(e){alert('创建失败：'+e.message)}
}
async function projectDelete(id,name){
  if(!confirm(`确认删除项目「${name}」？（关联任务将解除归属，不删除）`))return
  try{await api('DELETE','/api/projects/'+id);go('projects')}catch(e){alert(e.message)}
}
/* ---- 知识库 ---- */
async function kbCreate(){
  const name=$('#kb-name')?.value.trim()
  if(!name){alert('请填写知识库名称');return}
  try{await api('POST','/api/knowledge',{name,description:$('#kb-desc')?.value.trim()||null});go('knowledge')}catch(e){alert('创建失败：'+e.message)}
}
async function kbItemCreate(kbId){
  const title=$('#ki-title')?.value.trim(); const content=$('#ki-content')?.value.trim()
  if(!title||!content){alert('请填写条目标题与正文');return}
  try{await api('POST',`/api/knowledge/${kbId}/items`,{title,content,tags:$('#ki-tags')?.value.trim()||null});go('knowledge')}catch(e){alert('添加失败：'+e.message)}
}
async function kbItemDelete(id){
  if(!confirm('确认删除该条目？'))return
  try{await api('DELETE','/api/knowledge/item/'+id);go('knowledge')}catch(e){alert(e.message)}
}
