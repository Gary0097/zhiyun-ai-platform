<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}财务智能化中枢{% endblock %} · 金汉隆</title>
<link rel="stylesheet" href="/static/vendor/element-ui.css">
<script src="/static/vendor/vue.min.js"></script>
<script src="/static/vendor/element-ui.js"></script>
<script src="/static/vendor/axios.min.js"></script>
<script src="/static/vendor/echarts.min.js"></script>
<style>
  /* ===== 8000 AIOS 主系统风格主题（暖白底 + 橙色主色 + 暖灰描边）===== */
  :root{
    --app-bg:#f9f8f4; --app-surface:#ffffff; --app-surface-subtle:#faf9f7;
    --app-border:#eae8e7; --app-border-strong:#d8d4cf; --app-border-subtle:#f0eeeb;
    --app-text:rgba(20,20,19,.88); --app-text-2:rgba(20,20,19,.58); --app-text-3:rgba(20,20,19,.45);
    --app-accent:#ff7f16; --app-accent-hover:#ff9d4d; --app-accent-active:#d96806;
    --app-accent-text:#bd5100; --app-accent-soft:rgba(255,127,22,.10); --app-accent-border:rgba(255,127,22,.42);
    --app-selected-bg:#e6f4ff; --app-selected-border:#1677ff;
    --app-success:#52c41a; --app-warning:#faad14; --app-error:#ff4d4f;
    --app-shadow-sm:0 2px 8px rgba(0,0,0,.06); --app-shadow-md:0 4px 16px rgba(0,0,0,.08);
    --app-radius:12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--app-bg); color:var(--app-text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  #app { height:100%; }
  /* 顶栏：白色表面 + 暖灰描边（对齐 AIOS 顶栏） */
  .topbar { height:54px; background:var(--app-surface); color:var(--app-text);
    border-bottom:1px solid var(--app-border); display:flex; align-items:center; padding:0 20px; gap:12px;
    box-shadow:none; position:relative; }
  .topbar .brand { font-size:15.5px; font-weight:600; letter-spacing:.2px; color:var(--app-text);
    display:inline-flex; align-items:center; gap:9px; }
  .topbar .brand::before{ content:""; width:26px; height:26px; border-radius:7px;
    background:linear-gradient(135deg,#ff7f16,#ff9d4d); box-shadow:0 2px 6px rgba(255,127,22,.28); }
  .topbar .sub { margin-left:6px; font-size:12px; color:var(--app-text-3); }
  .topbar .nav { margin-left:auto; display:flex; gap:6px; }
  .topbar .nav a { color:var(--app-text-2); text-decoration:none; padding:6px 14px; border-radius:8px;
    font-size:13px; border:1px solid transparent; transition:all .15s; }
  .topbar .nav a:hover { background:var(--app-accent-soft); color:var(--app-accent-text); }
  .topbar .nav a.active { background:var(--app-accent-soft); color:var(--app-accent-text);
    border-color:var(--app-accent-border); font-weight:600; }
  .page { padding:18px; max-width:1500px; margin:0 auto; }
  .card-box { background:var(--app-surface); border:1px solid var(--app-border); border-radius:var(--app-radius);
    padding:16px; box-shadow:var(--app-shadow-sm); margin-bottom:14px; }
  .card-title { font-size:14.5px; font-weight:600; color:var(--app-text); margin-bottom:12px;
    border-left:3px solid var(--app-accent); padding-left:9px; }
  .num { font-family:"DIN Alternate","Arial",sans-serif; color:var(--app-text); }
  /* 让 element-ui 与主系统配色一致 */
  .el-button--primary{ background-color:var(--app-accent); border-color:var(--app-accent); }
  .el-button--primary:hover,.el-button--primary:focus{ background-color:var(--app-accent-hover); border-color:var(--app-accent-hover); }
  .el-button--primary:active{ background-color:var(--app-accent-active); border-color:var(--app-accent-active); }
  .el-button--text{ color:var(--app-accent-text); }
  .el-radio-button__orig-radio:checked+.el-radio-button__inner{ background:var(--app-accent);
    border-color:var(--app-accent); box-shadow:-1px 0 0 0 var(--app-accent); }
  .el-tabs__item.is-active,.el-tabs__item:hover{ color:var(--app-accent-text); }
  .el-tabs__active-bar{ background-color:var(--app-accent); }
  .el-pagination.is-background .el-pager li:not(.disabled).active{ background-color:var(--app-accent); }
  .el-pagination.is-background .el-pager li:not(.disabled):hover{ color:var(--app-accent-text); }
  .el-table th{ background:var(--app-surface-subtle); color:var(--app-text-2); font-weight:600; }
  .el-table{ color:var(--app-text); }
  .el-table--enable-row-hover .el-table__body tr:hover>td{ background:var(--app-surface-subtle); }
  .el-link.el-link--primary{ color:var(--app-accent-text); }
  .el-input__inner:focus,.el-textarea__inner:focus,.el-select .el-input.is-focus .el-input__inner{
    border-color:var(--app-accent); box-shadow:0 0 0 2px var(--app-accent-soft); }
  .el-checkbox__input.is-checked .el-checkbox__inner,.el-checkbox__input.is-indeterminate .el-checkbox__inner{
    background-color:var(--app-accent); border-color:var(--app-accent); }
  .el-checkbox__input.is-checked+.el-checkbox__label{ color:var(--app-accent-text); }
  .el-radio__input.is-checked .el-radio__inner{ background:var(--app-accent); border-color:var(--app-accent); }
  .el-switch.is-checked .el-switch__core{ background-color:var(--app-accent); border-color:var(--app-accent); }
  .el-select-dropdown__item.selected{ color:var(--app-accent-text); }
  .el-date-table td.current:not(.disabled) span{ background-color:var(--app-accent); }
  .el-tag--primary,.el-tag{ border-radius:6px; }
  .el-tag--primary{ background:var(--app-accent-soft); border-color:var(--app-accent-border); color:var(--app-accent-text); }
  .el-progress-bar__inner{ background-color:var(--app-accent); }
  .el-slider__bar{ background-color:var(--app-accent); }
  .el-slider__button{ border-color:var(--app-accent); }
  .el-step__head.is-process{ color:var(--app-accent); border-color:var(--app-accent); }
  .el-step__title.is-process{ color:var(--app-accent-text); }
  .el-menu-item.is-active{ color:var(--app-accent-text); }
  .el-loading-spinner .path{ stroke:var(--app-accent); }
</style>
<style>
{% block style %}{% endblock %}
</style>
<script>
/* 统一图表色板为主系统风格：橙主色 + 信息蓝/成功绿/警告黄/错误红 */
(function () {
  function apply() {
    if (!window.echarts) return false;
    if (!echarts.__hubTheme) {
      echarts.registerTheme('hub', { color: ['#ff7f16','#1677ff','#52c41a','#faad14','#ff4d4f','#d96806','#13c2c2','#722ed1','#8c8c8c'] });
      var _init = echarts.init;
      echarts.init = function (el, theme, opts) { return _init.call(echarts, el, theme || 'hub', opts); };
      echarts.__hubTheme = true;
    }
    return true;
  }
  if (!apply()) { var t = setInterval(function(){ if (apply()) clearInterval(t); }, 50); setTimeout(function(){ clearInterval(t); }, 5000); }
})();
</script>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="brand">💰 财务智能化中枢</span>
    <span class="sub">广东金汉隆智能装备科技有限公司 · 财务流程自动化</span>
    <div class="nav">
      <a href="/" :class="{active:$route==='home'}">首页</a>
      <a href="/audit" :class="{active:$route==='audit'}">智能报销审核</a>
      <a href="/dashboard" :class="{active:$route==='dashboard'}">数据分析看板</a>
      <a href="/bom" :class="{active:$route==='/bom'}">智能成本预测模型</a>
      <a href="/data" :class="{active:$route==='/data'}">数据管理</a>
    </div>
  </div>
  {% block body %}{% endblock %}
</div>
<script>
Vue.prototype.$route = location.pathname.replace(/\/$/,'') || '/';
</script>
{% block script %}{% endblock %}
</body>
</html>
